services:
  mysql:
    image: mysql:8.0
    container_name: event-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: eventdb
      MYSQL_USER: eventuser
      MYSQL_PASSWORD: eventpass
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: sachinace033/event-backend:latest
    #build: ./backend
    container_name: event-backend
    restart: always
    env_file:
      - backend/.env
    depends_on:
      - mysql
    ports:
      - "8000:8000"

  frontend:
    image: sachinace033/event-frontend:latest
    #build: ./frontend
    container_name: event-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
