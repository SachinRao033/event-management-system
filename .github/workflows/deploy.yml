name: Event Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/event-backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/event-frontend:latest ./frontend

      - name: Push Backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/event-backend:latest

      - name: Push Frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/event-frontend:latest

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,backend/.env"
          target: "/home/ubuntu/event-management-system"

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/event-management-system

            echo "Pull images from docker repo..."
            docker compose pull

            echo "Stopping old containers..."
            docker compose down

            echo "Starting application..."
            docker compose up -d

            echo "Waiting for containers..."
            sleep 15

            echo "Container status:"
            docker compose ps

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "======================================"
            echo "Deployment Completed Successfully"
            echo "======================================"
